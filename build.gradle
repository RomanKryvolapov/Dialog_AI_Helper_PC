plugins {
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.3.20'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.20'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

application {
    mainClass = "app.MainKt"
}

javafx {
    version = '26'
    modules = ['javafx.controls', 'javafx.base', 'javafx.graphics']
}

group = 'com.romankryvolapov.shortcuts'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    kotlinVersion = '2.3.20'
    kotlinxCoroutines = '1.10.2'
    javaFxVersion =  '26'
    ktor_version = "3.4.2"
    logback_version = '1.5.32'
    kotlinx_serialization_json_version = "1.11.0"
    moshi_version = '1.15.2'
    lc_4_j_version = '1.13.0'
    koin_version = '4.2.1'
}


dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"

    implementation "org.openjfx:javafx-controls:$javaFxVersion"
    implementation "org.openjfx:javafx-base:$javaFxVersion"
    implementation "org.openjfx:javafx-graphics:$javaFxVersion"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlinxCoroutines"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-javafx:$kotlinxCoroutines"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:$kotlinx_serialization_json_version"

    implementation 'net.java.dev.jna:jna:5.18.1'

    implementation("org.json:json:20251224")

    implementation "io.ktor:ktor-client-core:$ktor_version"
    implementation "io.ktor:ktor-client-cio:$ktor_version"
    implementation "io.ktor:ktor-client-content-negotiation:$ktor_version"
    implementation "io.ktor:ktor-serialization-kotlinx-json:$ktor_version"
    implementation "io.ktor:ktor-client-logging:$ktor_version"
    implementation "ch.qos.logback:logback-classic:$logback_version"
    implementation "com.squareup.moshi:moshi:$moshi_version"
    implementation "com.squareup.moshi:moshi-kotlin:$moshi_version"
    implementation "org.slf4j:slf4j-api:2.0.17"

    implementation "dev.langchain4j:langchain4j:$lc_4_j_version"
    implementation "dev.langchain4j:langchain4j-open-ai:$lc_4_j_version"
    implementation "dev.langchain4j:langchain4j-google-ai-gemini:$lc_4_j_version"
    implementation("dev.langchain4j:langchain4j-http-client-jdk:$lc_4_j_version")
    implementation "dev.langchain4j:langchain4j-anthropic:$lc_4_j_version"

    implementation "io.insert-koin:koin-core:$koin_version"
    implementation "io.insert-koin:koin-core-coroutines:$koin_version"

    // sherpa-onnx desktop (in-process streaming ASR): API jar + Windows x64 native libs.
    // Vendored from https://github.com/k2-fsa/sherpa-onnx/releases (no desktop Maven artifact).
    implementation files('libs/sherpa-onnx-v1.13.2.jar', 'libs/sherpa-onnx-native-lib-win-x64-v1.13.2.jar')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

kotlin {
    jvmToolchain(24)
}

tasks.register('runMainKt', JavaExec) {
    group = 'application'
    description = 'Runs DialogApplicationKt manually, bypassing application plugin'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'app.MainKt'
}